# publish.yml -- adds the R packages to the apt + dnf repository and
# keeps its metadata complete.
#
# Two publishers write to this repository:
#   morie                       morie's release-debrpm.yml, on each morie
#                               tag (it pushes here with a deploy token)
#   rmorie, rmoriedata,         this workflow, from r-universe
#   rmoriebricklayer
#
# morie's workflow rewrites the index with only the morie version it just
# built. Its push starts this workflow, which rebuilds the apt and dnf
# metadata from every package in the pool, so the R packages stay
# installable.
#
# - The pool keeps only the newest version of each package and
#   architecture (packaging/latest.py); older files are removed before the
#   metadata is rebuilt, so apt and dnf offer the current release only.
#
# - The R packages are thin wrappers: the post-install script installs the
#   package from r-universe and compiles it on the target machine, hence
#   Architecture: all / noarch.
# - A version already in the pool is not rebuilt (unless forced); a run
#   with nothing new and a complete index changes nothing.
# - Inert until GPG_PRIVATE_KEY + GPG_PASSPHRASE exist, and refuses any
#   key other than the one in key.gpg, which users already trust.
name: publish

on:
  push:
    branches: [main]
    paths:
      - "apt/**"
      - "rpm/**"
      - "packaging/**"
      - ".github/workflows/publish.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "rebuild the R packages already in the pool"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for the signing key
        id: key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "${GPG_PRIVATE_KEY}" ]; then
            echo "::notice::GPG_PRIVATE_KEY and GPG_PASSPHRASE are not set; nothing published."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install tooling
        if: steps.key.outputs.ok == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ruby ruby-dev build-essential rpm gnupg dpkg-dev apt-utils createrepo-c
          sudo gem install --no-document fpm

      - name: Import the signing key (must be the key in key.gpg)
        if: steps.key.outputs.ok == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import 2>/dev/null
          FPR=$(gpg --show-keys --with-colons key.gpg | awk -F: '/^fpr:/ {print $10; exit}')
          if ! gpg --list-secret-keys --with-colons "$FPR" >/dev/null 2>&1; then
            echo "::error::GPG_PRIVATE_KEY is not the key in key.gpg ($FPR); users' apt and dnf would reject it."
            exit 1
          fi
          echo "GPG_KEYID=${FPR}" >> "$GITHUB_ENV"

      - name: Build the R packages r-universe has and the pool lacks
        if: steps.key.outputs.ok == 'true'
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://rootcoder007.r-universe.dev/src/contrib/PACKAGES > PACKAGES
          python3 packaging/plan.py PACKAGES > plan.txt
          cat plan.txt
          : > built.txt
          while read -r pkg ver floor needs; do
            [ "$needs" = - ] && needs=""
            needs="${needs//,/ }"
            if [ "${FORCE}" != "true" ] && [ -f "apt/pool/main/${pkg}_${ver}_all.deb" ] \
               && [ -f "rpm/packages/${pkg}-${ver}.noarch.rpm" ]; then
              echo "${pkg} ${ver}: already in the pool"
              continue
            fi
            R_FLOOR="$floor" NEEDS="$needs" bash packaging/fpm-r-deb.sh "$pkg" "$ver"
            R_FLOOR="$floor" NEEDS="$needs" bash packaging/fpm-r-rpm.sh "$pkg" "$ver"
            echo "${pkg} ${ver}" >> built.txt
          done < plan.txt
          rm -f PACKAGES plan.txt

      - name: Sign the new RPMs, and any in the pool the key does not verify
        if: steps.key.outputs.ok == 'true'
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          umask 077
          printf '%s' "${GPG_PASSPHRASE}" > "$RUNNER_TEMP/pass"
          cat > ~/.rpmmacros <<MACROS
          %_gpg_name ${GPG_KEYID}
          %_gpg_path ${GNUPGHOME:-$HOME/.gnupg}
          %__gpg /usr/bin/gpg
          %__gpg_sign_cmd /usr/bin/gpg gpg --batch --pinentry-mode loopback --passphrase-file $RUNNER_TEMP/pass --no-armor -u "%{_gpg_name}" -sbo %{__signature_filename} --digest-algo sha256 %{__plaintext_filename}
          MACROS
          gpg --armor --export "${GPG_KEYID}" > pub.asc
          rpm --dbpath "$PWD/rpmdb" --initdb
          rpmkeys --dbpath "$PWD/rpmdb" --import pub.asc
          for f in dist/*.rpm; do
            if [ -e "$f" ]; then rpmsign --addsign "$f"; fi
          done
          # after a key change the pool's older packages carry the old
          # signature; dnf checks each package against key.gpg
          : > resigned.txt
          for f in rpm/packages/*.rpm; do
            [ -e "$f" ] || continue
            if ! rpmkeys --dbpath "$PWD/rpmdb" --checksig "$f" >/dev/null 2>&1; then
              rpmsign --addsign "$f"
              echo "$f" >> resigned.txt
            fi
          done
          rm -f "$RUNNER_TEMP/pass"
          for f in dist/*.rpm rpm/packages/*.rpm; do
            if [ -e "$f" ]; then rpmkeys --dbpath "$PWD/rpmdb" --checksig "$f"; fi
          done
          echo "re-signed: $(wc -l < resigned.txt)"
          rm -rf rpmdb pub.asc

      - name: Add to the pool, rebuild the metadata, push
        if: steps.key.outputs.ok == 'true'
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          git config user.name rootcoder007
          git config user.email 278967282+rootcoder007@users.noreply.github.com
          for try in 1 2 3; do
            mkdir -p apt/pool/main rpm/packages
            cp dist/*.deb apt/pool/main/ 2>/dev/null || true
            cp dist/*.rpm rpm/packages/ 2>/dev/null || true
            # only the newest version of each package and architecture stays
            python3 packaging/latest.py --old apt/pool/main/*.deb rpm/packages/*.rpm > old.txt
            if [ -s old.txt ]; then xargs rm -f -- < old.txt; fi
            echo "older versions removed: $(wc -l < old.txt)"
            if [ ! -s built.txt ] && [ ! -s resigned.txt ] && [ ! -s old.txt ] && python3 packaging/plan.py --complete; then
              echo "index already lists every package in the pool; nothing to do"
              exit 0
            fi
            bash packaging/reindex.sh
            git add -A apt rpm
            what=$(tr '\n' ' ' < built.txt)
            [ -s resigned.txt ] && what="${what}re-signed $(wc -l < resigned.txt) rpm "
            [ -s old.txt ] && what="${what}removed $(wc -l < old.txt) older files "
            git commit -q -m "Publish apt/dnf repo: ${what:-reindex}"
            if git push origin HEAD:main; then exit 0; fi
            echo "push lost a race (try ${try}); starting again from the new main"
            git fetch -q origin main
            git reset -q --hard origin/main
          done
          exit 1
